# Service Chambre noire à placer dans la stack homelab.yml (Portainer).
# Les variables viennent des « Environment variables » de la stack (voir .env.example).
services:
  chambre-noire:
    image: ghcr.io/baloodusudouest/chambre-noire:latest
    container_name: chambre-noire
    depends_on:
      - immich-server
    environment:
      - TZ=${TZ}
      # Variables communes de la maison (module app/maison.py)
      - MAISON_PASSWORD=${MAISON_PASSWORD}                        # mot de passe commun des applis (12 caractères au moins)
      - MAISON_JETON=${MAISON_JETON:-}                            # jeton commun : ouvre /externe/noms (Millésime) et /externe/sauvegarde (Anneau)
      - ANNEAU_CLE=${ANNEAU_CLE:-}                                # contrat 3 : l'Anneau lit les fiches « Connexion » ; vide = porte fermée
      - MAISON_LECTURE_SEULE=${MAISON_LECTURE_SEULE:-}            # « oui » : aucune appli n'écrit ; CHAMBRE_NOIRE_LECTURE_SEULE l'emporte si posée
      - CHAMBRE_NOIRE_LECTURE_SEULE=${CHAMBRE_NOIRE_LECTURE_SEULE:-}   # « oui » ou « non » : force Chambre noire seule
      - CHAMBRE_NOIRE_IMMICH_URL=http://immich_server:2283
      - CHAMBRE_NOIRE_IMMICH_CLE=${CHAMBRE_NOIRE_IMMICH_CLE}       # clé d'API Immich dédiée
      - CHAMBRE_NOIRE_ML_URL=http://immich_machine_learning:3003
      # 0.7.0 : le libellé et l'album des non datées se règlent dans l'appli (Réglages › Noms dans Immich),
      # sauvegardés chaque nuit par l'Anneau. Les anciennes lignes CHAMBRE_NOIRE_LIBELLE et
      # CHAMBRE_NOIRE_ALBUM_NON_DATEES ne sont reprises qu'une fois, au premier démarrage de la 0.7.0 :
      # les garder pour ce premier démarrage, puis les retirer de la stack.
    ports:
      - "${PORT_CHAMBRE_NOIRE:-8100}:8100"         # réseau local ; caméra par HTTPS (tailscale serve)
    volumes:
      - ${DOCKER_ROOT}/chambre-noire:/data         # état de l'appli (sessions, zone d'attente, réglages)
    labels:
      # Chambre noire écrit dans Immich : pas de mise à jour automatique
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
