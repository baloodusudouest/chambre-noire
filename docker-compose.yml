# Service Chambre noire à placer dans la stack homelab.yml (Portainer).
# Les variables viennent des « Environment variables » de la stack (voir .env.example).
services:
  chambre-noire:
    image: ghcr.io/baloodusudouest/chambre-noire:latest
    container_name: chambre-noire
    depends_on:
      - immich-server
    environment:
      - TZ=${TZ}
      - CHAMBRE_NOIRE_PASSWORD=${CARNET_PASSWORD}                 # mot de passe commun des applis, obligatoire
      - CHAMBRE_NOIRE_IMMICH_URL=http://immich_server:2283
      - CHAMBRE_NOIRE_IMMICH_CLE=${CHAMBRE_NOIRE_IMMICH_CLE}       # clé d'API Immich dédiée
      - CHAMBRE_NOIRE_ML_URL=http://immich_machine_learning:3003
      - CHAMBRE_NOIRE_LECTURE_SEULE=${CHAMBRE_NOIRE_LECTURE_SEULE:-}   # « oui » : rien n'est écrit dans Immich
    ports:
      - "${PORT_CHAMBRE_NOIRE:-8100}:8100"         # réseau local ; caméra par HTTPS (tailscale serve)
    volumes:
      - ${DOCKER_ROOT}/chambre-noire:/data         # état de l'appli (sessions ; zone d'attente à l'étape 2)
    labels:
      # Chambre noire écrira dans Immich : pas de mise à jour automatique
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
